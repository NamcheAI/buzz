name: deploy-production

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/namcheai/buzz

jobs:
  guard:
    if: vars.DEPLOYS_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      image: ${{ steps.staged-image.outputs.image }}
    steps:
      - name: Verify tag source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ github.ref }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${TAG_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9][0-9A-Za-z._-]{0,112}$ ]]; then
            echo "::error::Invalid release tag: ${tag}"
            exit 1
          fi
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TAG_SHA}...main" --jq '.status')"
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::${tag} is not contained in main"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Verify CI succeeded for this sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          count="$(gh api --paginate \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${TAG_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | length' \
            | awk '{ total += $1 } END { print total + 0 }')"
          if [ "$count" -eq 0 ]; then
            echo "::error::No successful trusted CI run exists for ${TAG_SHA}"
            exit 1
          fi

      - name: Verify staging was dispatched this sha
        id: staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
          RELEASE_STEP_PREFIX: Release to staging
        run: |
          set -euo pipefail
          run_ids="$(gh api --paginate \
            "repos/${REPO}/actions/workflows/deploy.yml/runs?head_sha=${TAG_SHA}&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id')"
          for run_id in $run_ids; do
            released="$(gh api --paginate "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" \
              | jq --arg prefix "$RELEASE_STEP_PREFIX" \
                '[.jobs[] | select(.name == "staging") | .steps[]?
                  | select(.name | startswith($prefix))
                  | select(.conclusion == "success")] | length' \
              | awk '{ total += $1 } END { print total + 0 }')"
            if [ "$released" -gt 0 ]; then
              artifact_count="$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" \
                | jq --arg name "staged-digest-${TAG_SHA}" \
                  '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
              if [ "$artifact_count" -gt 0 ]; then
                echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done
          echo "::error::No staging dispatch with a retained digest exists for ${TAG_SHA}"
          exit 1

      - name: Download staged digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-digest-${{ github.sha }}
          path: /tmp/staged-digest
          run-id: ${{ steps.staging.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate staged immutable image
        id: staged-image
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$(cat "/tmp/staged-digest/staged-image-${TAG_SHA}.txt")"
          if [[ ! "$image" =~ ^ghcr\.io/namcheai/buzz@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Malformed staged image ref"
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  promote:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      image: ${{ steps.promote.outputs.image }}
    env:
      TAG_NAME: ${{ needs.guard.outputs.tag }}
      STAGED_IMAGE: ${{ needs.guard.outputs.image }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_ACTOR: ${{ github.actor }}
    steps:
      - name: Promote staged manifest
        id: promote
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo
          }
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          digest="${STAGED_IMAGE##*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Malformed staged digest: ${digest}"
            exit 1
          fi
          skopeo copy "docker://${STAGED_IMAGE}" "docker://${IMAGE}:${TAG_NAME}"
          echo "image=${STAGED_IMAGE}" >> "$GITHUB_OUTPUT"

  production:
    needs: [guard, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      IMAGE_REF: ${{ needs.promote.outputs.image }}
    steps:
      - name: Release to production (dispatch to infra)
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::INFRA_DISPATCH_TOKEN is empty"
            exit 1
          fi
          gh workflow run deploy-app.yml -R NamcheAI/infra --ref main \
            -f app=buzz \
            -f environment=production \
            -f image="$IMAGE_REF"
          echo "::notice::Dispatched production deploy of ${IMAGE_REF}."
