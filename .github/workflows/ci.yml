name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out deployment wrapper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate upstream lock
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          repository="$(jq -er '.repository' upstream.lock)"
          commit="$(jq -er '.commit' upstream.lock)"
          if [ "$repository" != "block/buzz" ]; then
            echo "::error::upstream.lock repository must be block/buzz"
            exit 1
          fi
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::upstream.lock commit must be a full lowercase Git SHA"
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned upstream
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.commit }}
          path: upstream
          persist-credentials: false

      - name: Verify upstream checkout
        env:
          EXPECTED_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git -C upstream rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "::error::checked out ${actual}, expected ${EXPECTED_COMMIT}"
            exit 1
          fi
          git -C upstream diff --quiet
          git -C upstream diff --cached --quiet

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Build upstream OCI archive
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          provenance: false
          outputs: type=oci,dest=/tmp/buzz-image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/NamcheAI/buzz
            org.opencontainers.image.url=https://github.com/block/buzz/tree/${{ steps.upstream.outputs.commit }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.commit }}
            ai.namche.buzz.upstream-repository=${{ steps.upstream.outputs.repository }}
          cache-from: type=gha,scope=buzz-upstream-linux-amd64
          cache-to: type=gha,scope=buzz-upstream-linux-amd64,mode=max

      - name: Preserve trusted main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-oci-${{ github.sha }}
          path: /tmp/buzz-image.tar
          retention-days: 3
          if-no-files-found: error
